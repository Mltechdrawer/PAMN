<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="720" viewBox="0 0 1300 720"><rect width="1300" height="720" fill="#f5f7f6"/><text x="60" y="60" font-family="sans-serif" font-size="32" fill="#233e35">Escenas y decisiones sobre el proceso</text><rect x="80" y="110" width="1140" height="80" rx="15" fill="#e0ece6" stroke="#527965" stroke-width="2"/><text x="110" y="160" font-family="sans-serif" font-size="23" fill="#233e35">Escena active ↔ inactive</text><path d="M140 194 L140 244 M133 235 L140 245 L147 235" fill="none" stroke="#527965" stroke-width="3"/><text x="175" y="230" font-family="sans-serif" font-size="23" fill="#40554b">fases de la escena</text><rect x="80" y="255" width="1140" height="80" rx="15" fill="#e0ece6" stroke="#527965" stroke-width="2"/><text x="110" y="305" font-family="sans-serif" font-size="23" fill="#233e35">Escena inactive ↔ background</text><path d="M140 339 L140 389 M133 380 L140 390 L147 380" fill="none" stroke="#527965" stroke-width="3"/><text x="175" y="375" font-family="sans-serif" font-size="23" fill="#40554b">decisión de iOS; background no significa suspendido</text><rect x="80" y="400" width="1140" height="80" rx="15" fill="#e0ece6" stroke="#527965" stroke-width="2"/><text x="110" y="450" font-family="sans-serif" font-size="23" fill="#233e35">Proceso: ejecución limitada → suspensión posible</text><path d="M140 484 L140 534 M133 525 L140 535 L147 525" fill="none" stroke="#527965" stroke-width="3"/><text x="175" y="520" font-family="sans-serif" font-size="23" fill="#40554b">recuperar datos persistidos</text><rect x="80" y="545" width="1140" height="80" rx="15" fill="#e0ece6" stroke="#527965" stroke-width="2"/><text x="110" y="595" font-family="sans-serif" font-size="23" fill="#233e35">Proceso: terminación posible → nuevo lanzamiento</text></svg>